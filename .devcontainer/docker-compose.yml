# Full project environment: development container (app) + MongoDB (replica set) + Redis.
# The project runs only inside this dev container (GitHub Codespaces or local Docker),
# so no port is published to the host; devcontainer.json forwards them when needed.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      TZ: America/Argentina/Buenos_Aires   # "today" is the system date in Argentina time
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    # Single-node replica set: required for multi-document transactions (q14 + q15).
    # The cache is capped so MongoDB leaves memory for the rest of the dev container.
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    restart: unless-stopped   # if the engine ever stops, Docker starts it again
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; healthy only once there is a PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) };
        quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4
    # Redis only holds data derived from MongoDB (cache, ranking, idempotency keys), all of
    # it rebuildable, so the default AOF policy (fsync every second) is enough.
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  redis-data:
